[project]
name = "xbuddy-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

